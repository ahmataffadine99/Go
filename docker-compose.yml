version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/ecommerce?sslmode=disable
    depends_on:
      - db

volumes:
  postgres_data:
